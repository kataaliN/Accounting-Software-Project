<main style="padding:2rem 3rem;background:#080e1a;min-height:calc(100vh - 78px);font-family:'DM Sans',sans-serif;">

    <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.75rem;flex-wrap:wrap;">
        <button onclick="history.back()" style="background:transparent;border:1px solid rgba(255,255,255,0.12);color:#94a3b8;padding:6px 14px;border-radius:6px;font-size:0.8rem;margin:0;" data-tooltip="Go back">← Back</button>
        <div>
            <h1 id="eventLogTitle" style="font-size:1.4rem;font-weight:700;color:#f1f5f9;margin:0;">Event Log</h1>
            <p  id="eventLogSubtitle" style="font-size:0.82rem;color:#64748b;margin:4px 0 0;"></p>
        </div>
    </div>

    <div id="eventLogContainer"></div>

</main>

<div id="helpModal"   class="help-modal"  style="display:none;"></div>
<div id="helpOverlay" class="help-overlay"></div>

<script src="script.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const params      = new URLSearchParams(window.location.search);
        const accountName = params.get("account") || "";
        const eventLogs   = JSON.parse(localStorage.getItem("eventLogs")) || {};
        const events      = eventLogs[accountName] || [];

        document.getElementById("eventLogTitle").textContent    = accountName ? `${accountName} — Event Log` : "Event Log";
        document.getElementById("eventLogSubtitle").textContent = `${events.length} event(s) recorded`;

        const container = document.getElementById("eventLogContainer");

        if (!events.length) {
            container.innerHTML = `<div style="text-align:center;padding:3rem;color:#475569;font-size:0.9rem;">No events recorded for this account yet.<br><span style="font-size:0.8rem;color:#334155;">Events are recorded when accounts are created, edited, or when journal entries are approved.</span></div>`;
            return;
        }

        // Fields to highlight in the diff — most important ones first
        const KEY_LABELS = {
            balance:     "Balance",
            debit:       "Total Debit",
            credit:      "Total Credit",
            accountName: "Account Name",
            status:      "Status",
            description: "Description",
            normalSide:  "Normal Side",
            category:    "Category",
            subcategory: "Subcategory",
            userId:      "User ID",
            comment:     "Comment",
            statement:   "Statement Type",
        };

        events.forEach((ev, i) => {
            const isCreate  = !ev.before;
            const isJournal = !!ev.action; // journal-driven events have an action string

            // Determine event type label
            let typeLabel, typeBg;
            if (isCreate) {
                typeLabel = "Created"; typeBg = "color:#34d399;background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2);";
            } else if (isJournal) {
                typeLabel = "Journal Posted"; typeBg = "color:#60a5fa;background:rgba(96,165,250,0.1);border:1px solid rgba(96,165,250,0.2);";
            } else {
                typeLabel = "Modified"; typeBg = "color:#fbbf24;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.2);";
            }

            // Build diff rows — show all fields on create, changed fields only on edit/journal
            let diffRows = "";
            const after  = ev.after  || {};
            const before = ev.before || {};

            const keys = isCreate
                ? Object.keys(KEY_LABELS).filter(k => after[k] !== undefined)
                : Object.keys(KEY_LABELS).filter(k => {
                    const b = before[k], a = after[k];
                    return JSON.stringify(b) !== JSON.stringify(a) && (b !== undefined || a !== undefined);
                });

            if (keys.length === 0) {
                diffRows = `<tr><td colspan="3" style="padding:10px 12px;color:#475569;font-size:0.8rem;">No tracked field changes detected.</td></tr>`;
            } else {
                keys.forEach(k => {
                    const lbl = KEY_LABELS[k] || k;
                    const bVal = isCreate ? "—" : (before[k] !== undefined ? before[k] : "—");
                    const aVal = after[k] !== undefined ? after[k] : "—";
                    // Format currency fields
                    const fmt  = (v) => (k === "balance" || k === "debit" || k === "credit") && !isNaN(v) && v !== "—"
                        ? `$${parseFloat(v).toFixed(2)}` : v;
                    diffRows += `
                <tr>
                    <td style="color:#64748b;padding:8px 12px;font-size:0.8rem;font-weight:600;white-space:nowrap;">${lbl}</td>
                    <td style="color:#f87171;padding:8px 12px;font-size:0.8rem;${isCreate?'color:#475569;font-style:italic;':''}">${isCreate ? "—" : fmt(bVal)}</td>
                    <td style="color:#34d399;padding:8px 12px;font-size:0.8rem;font-weight:${k==='balance'?'700':'400'};">${fmt(aVal)}</td>
                </tr>`;
                });
            }

            container.innerHTML += `
        <div style="background:linear-gradient(140deg,#0d1a2e,#080e1a);border:1px solid rgba(255,255,255,0.07);border-radius:10px;margin-bottom:1rem;overflow:hidden;">
            <!-- Event header -->
            <div style="display:flex;align-items:flex-start;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06);flex-wrap:wrap;gap:8px;">
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <span style="font-size:0.68rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;${typeBg}">${typeLabel}</span>
                    <span style="font-size:0.82rem;color:#94a3b8;font-weight:600;">Event #${i + 1}</span>
                    ${ev.action ? `<span style="font-size:0.78rem;color:#475569;font-style:italic;">${ev.action}</span>` : ""}
                </div>
                <div style="font-size:0.75rem;color:#475569;display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
                    <span>👤 <strong style="color:#94a3b8;">${ev.userId || "—"}</strong></span>
                    <span>🕐 ${ev.timestamp ? new Date(ev.timestamp).toLocaleString() : "—"}</span>
                </div>
            </div>
            <!-- Diff table -->
            <table style="width:100%;border-collapse:collapse;">
                <thead>
                    <tr style="background:rgba(255,255,255,0.03);">
                        <th style="padding:8px 12px;text-align:left;font-size:0.68rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#475569;width:30%;">Field</th>
                        <th style="padding:8px 12px;text-align:left;font-size:0.68rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#f87171;width:35%;">Before</th>
                        <th style="padding:8px 12px;text-align:left;font-size:0.68rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#34d399;width:35%;">After</th>
                    </tr>
                </thead>
                <tbody>${diffRows}</tbody>
            </table>
        </div>`;
        });
    });
</script>
</body>
</html>
